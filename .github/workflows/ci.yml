name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: true
      CARGO_BUILD_JOBS: 2
      TASKFOCUSER_DATA_DIR: ${{ runner.temp }}/task-focuser-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev sway grim wtype dbus-x11 python3 build-essential libwayland-bin
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ matrix.os }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Build native test binary
        if: runner.os == 'Linux'
        run: cargo build --locked -p task-focuser
      - name: Test the native Wayland window
        if: runner.os == 'Linux'
        run: bash scripts/test-native.sh target/debug/task-focuser
      - name: Upload native test artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-test-artifacts
          path: target/native-test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build release binary
        run: cargo build --locked --release -p task-focuser
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "task-focuser-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C target/release task-focuser
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/task-focuser.exe -DestinationPath "task-focuser-${{ runner.os }}-${{ runner.arch }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: task-focuser-${{ runner.os }}-${{ runner.arch }}
          path: |
            task-focuser-*.tar.gz
            task-focuser-*.zip
          if-no-files-found: error
